<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Web Worker Basics</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Web Worker Basics</h1>
      </header>

      <article>
        <div>
          <img src="assets/giphy.gif" alt="animation" />
          <p>
            A simple gif image to check if the main UI thread isn't stucked.
          </p>
        </div>

        <div>
          <button>Heavy Processing</button>
          <fieldset>
            <legend>Processing Mode</legend>
            <label>
              <input type="radio" name="useWebWorker" /> WebWorker
            </label>
            <label>
              <input type="radio" name="useWebWorker" checked /> Without
              WebWorker
            </label>
          </fieldset>
        </div>

        <output id="output"></output>
      </article>
    </main>

    <script src="js/index.js"></script>
  </body>
</html>
